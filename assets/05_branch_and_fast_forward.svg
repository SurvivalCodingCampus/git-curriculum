<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .node-text { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .branch-tag { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .cmd-text { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #2563eb; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="450" rx="16" fill="#f8fafc" />
  <rect x="20" y="20" width="840" height="410" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- 상단 제목 -->
  <text x="50" y="58" class="title">브랜치(Branch) 생성과 Fast-Forward 머지 원리</text>
  <text x="50" y="80" class="subtitle">독립된 나뭇가지에서 개발한 뒤, master 브랜치를 최신 위치로 순식간에 앞당기는 과정</text>

  <!-- 상단 패널: 1. 브랜치 분기 -->
  <g transform="translate(50, 105)">
    <rect width="780" height="145" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="20" y="26" class="step-title" fill="#1e293b">1단계: 브랜치 분기 및 작업</text>
    <text x="200" y="26" class="cmd-text">git switch -c feature/profile</text>
    <text x="440" y="26" font-family="sans-serif" font-size="11" fill="#94a3b8">(기존: git checkout -b feature/profile)</text>

    <!-- 그래프 -->
    <g transform="translate(40, 50)">
      <!-- master 줄기 -->
      <line x1="20" y1="45" x2="160" y2="45" stroke="#3b82f6" stroke-width="4" />
      <circle cx="20" cy="45" r="14" fill="#3b82f6" />
      <text x="20" y="49" class="node-text" text-anchor="middle">C1</text>
      
      <circle cx="160" cy="45" r="14" fill="#3b82f6" />
      <text x="160" y="49" class="node-text" text-anchor="middle">C2</text>

      <!-- master 태그 -->
      <rect x="130" y="72" width="60" height="22" rx="4" fill="#1d4ed8" />
      <text x="160" y="87" class="branch-tag" text-anchor="middle">master</text>

      <!-- feature 줄기 (위로 분기) -->
      <path d="M 160 45 C 190 45, 200 15, 230 15 L 360 15" fill="none" stroke="#10b981" stroke-width="3.5" />
      
      <circle cx="250" cy="15" r="14" fill="#10b981" />
      <text x="250" y="19" class="node-text" text-anchor="middle">C3</text>
      <text x="250" y="-5" class="text-desc" text-anchor="middle">소개글 작성</text>

      <circle cx="360" cy="15" r="14" fill="#10b981" />
      <text x="360" y="19" class="node-text" text-anchor="middle">C4</text>
      <text x="360" y="-5" class="text-desc" text-anchor="middle">연락처 추가</text>

      <!-- feature 태그 & HEAD -->
      <rect x="390" y="4" width="105" height="22" rx="4" fill="#059669" />
      <text x="442" y="19" class="branch-tag" text-anchor="middle">feature/profile</text>
      <rect x="502" y="4" width="45" height="22" rx="4" fill="#0f172a" />
      <text x="524" y="19" class="branch-tag" text-anchor="middle">HEAD</text>
    </g>

    <text x="590" y="85" class="text-desc" fill="#059669">💡 master는 안전하게 C2에 머물고,</text>
    <text x="590" y="103" class="text-desc" fill="#059669">새 작업은 독립된 가지에서 진행!</text>
  </g>

  <!-- 하단 패널: 2. Fast-Forward 머지 -->
  <g transform="translate(50, 265)">
    <rect width="780" height="145" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" />
    <text x="20" y="26" class="step-title" fill="#065f46">2단계: Fast-Forward 머지 (순간이동 병합)</text>
    <text x="310" y="26" class="cmd-text" fill="#059669">git merge feature/profile</text>

    <!-- 그래프 -->
    <g transform="translate(40, 50)">
      <!-- 연결선 -->
      <line x1="20" y1="45" x2="160" y2="45" stroke="#3b82f6" stroke-width="4" />
      <circle cx="20" cy="45" r="14" fill="#3b82f6" />
      <text x="20" y="49" class="node-text" text-anchor="middle">C1</text>
      
      <circle cx="160" cy="45" r="14" fill="#3b82f6" />
      <text x="160" y="49" class="node-text" text-anchor="middle">C2</text>

      <!-- 일직선으로 흡수된 커밋들 -->
      <line x1="160" y1="45" x2="360" y2="45" stroke="#059669" stroke-width="4" />
      
      <circle cx="250" cy="45" r="14" fill="#059669" />
      <text x="250" y="49" class="node-text" text-anchor="middle">C3</text>

      <circle cx="360" cy="45" r="16" fill="#047857" stroke="#a7f3d0" stroke-width="3" />
      <text x="360" y="49" class="node-text" text-anchor="middle">C4</text>

      <!-- 이동 화살표 애니메이션 은유 -->
      <path d="M 160 85 C 230 110, 300 110, 360 85" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4,4" />
      <text x="260" y="115" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Fast-Forward (포인터 앞당기기)</text>

      <!-- 합쳐진 태그들 -->
      <rect x="385" y="34" width="58" height="22" rx="4" fill="#1d4ed8" />
      <text x="414" y="49" class="branch-tag" text-anchor="middle">master</text>

      <rect x="448" y="34" width="45" height="22" rx="4" fill="#0f172a" />
      <text x="470" y="49" class="branch-tag" text-anchor="middle">HEAD</text>
    </g>

    <text x="560" y="75" class="text-desc" fill="#065f46">✨ master에 새 커밋이 없었기 때문에</text>
    <text x="560" y="93" class="text-desc" fill="#065f46">별도의 머지 커밋 생성 없이</text>
    <text x="560" y="111" class="text-desc" fill="#065f46">master 포인터만 C4로 앞당겨집니다!</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .repo-title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .cmd-badge { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .text-main { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-push" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-pull" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-clone" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="430" rx="16" fill="#f8fafc" />
  <rect x="20" y="20" width="840" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- 상단 제목 -->
  <text x="50" y="58" class="title">로컬과 GitHub 원격 저장소 동기화 흐름</text>
  <text x="50" y="80" class="subtitle">push, pull, clone의 물리적 데이터 이동 파이프라인</text>

  <!-- 중앙 상단: GitHub 원격 저장소 (클라우드) -->
  <g transform="translate(290, 95)">
    <rect width="300" height="110" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <circle cx="35" cy="35" r="16" fill="#0f172a" />
    <!-- GitHub 옥토캣 간단 실루엣 형태 -->
    <text x="35" y="42" font-family="sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">🐙</text>
    <text x="65" y="34" class="repo-title" fill="#0f172a">GitHub 원격 저장소 (Remote)</text>
    <text x="65" y="50" class="text-desc">origin (https://github.com/내계정/git-practice.git)</text>

    <!-- 원격 커밋 표시 -->
    <g transform="translate(65, 68)">
      <circle cx="15" cy="15" r="8" fill="#475569" />
      <circle cx="55" cy="15" r="8" fill="#475569" />
      <circle cx="95" cy="15" r="10" fill="#2563eb" stroke="#93c5fd" stroke-width="2" />
      <line x1="23" y1="15" x2="47" y2="15" stroke="#94a3b8" stroke-width="2" />
      <line x1="63" y1="15" x2="85" y2="15" stroke="#94a3b8" stroke-width="2" />
      <rect x="115" y="6" width="76" height="18" rx="4" fill="#0f172a" />
      <text x="153" y="19" font-family="sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">origin/master</text>
    </g>
  </g>

  <!-- 좌측 하단: 내 컴퓨터 (회사 / 실습 폴더) -->
  <g transform="translate(50, 245)">
    <rect width="280" height="145" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="20" y="32" font-size="20">💻</text>
    <text x="50" y="28" class="repo-title" fill="#1e40af">내 로컬 저장소 A</text>
    <text x="50" y="44" class="text-desc">~/git-practice (.git)</text>

    <!-- 커밋 노드 -->
    <g transform="translate(20, 60)">
      <circle cx="20" cy="15" r="8" fill="#3b82f6" />
      <circle cx="70" cy="15" r="8" fill="#3b82f6" />
      <circle cx="120" cy="15" r="10" fill="#2563eb" />
      <line x1="28" y1="15" x2="62" y2="15" stroke="#93c5fd" stroke-width="2" />
      <line x1="78" y1="15" x2="110" y2="15" stroke="#93c5fd" stroke-width="2" />
      <rect x="138" y="6" width="50" height="18" rx="4" fill="#2563eb" />
      <text x="163" y="19" font-family="sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">master</text>
    </g>

    <text x="20" y="120" class="text-desc">내가 직접 코드를 작성하고 커밋하는 곳</text>
  </g>

  <!-- 우측 하단: 다른 컴퓨터 / 복제 폴더 B (집 컴퓨터) -->
  <g transform="translate(550, 245)">
    <rect width="280" height="145" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" />
    <text x="20" y="32" font-size="20">🏠</text>
    <text x="50" y="28" class="repo-title" fill="#6d28d9">내 로컬 저장소 B (복제본)</text>
    <text x="50" y="44" class="text-desc">~/git-practice-home (.git)</text>

    <!-- 커밋 노드 -->
    <g transform="translate(20, 60)">
      <circle cx="20" cy="15" r="8" fill="#8b5cf6" />
      <circle cx="70" cy="15" r="8" fill="#8b5cf6" />
      <circle cx="120" cy="15" r="10" fill="#7c3aed" />
      <line x1="28" y1="15" x2="62" y2="15" stroke="#c4b5fd" stroke-width="2" />
      <line x1="78" y1="15" x2="110" y2="15" stroke="#c4b5fd" stroke-width="2" />
      <rect x="138" y="6" width="50" height="18" rx="4" fill="#7c3aed" />
      <text x="163" y="19" font-family="sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">master</text>
    </g>

    <text x="20" y="120" class="text-desc">집이나 다른 동료가 복제하여 작업하는 곳</text>
  </g>

  <!-- 화살표 1: git push (좌측 하단 -> 중앙 상단) -->
  <g>
    <path d="M 180 245 C 180 180, 260 170, 285 160" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-push)" />
    <rect x="155" y="180" width="75" height="22" rx="11" fill="#2563eb" />
    <text x="192" y="195" class="cmd-badge" text-anchor="middle">git push</text>
  </g>

  <!-- 화살표 2: git pull (중앙 상단 -> 좌측 하단) -->
  <g>
    <path d="M 320 205 C 320 230, 270 230, 240 240" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-pull)" />
    <rect x="250" y="222" width="70" height="22" rx="11" fill="#059669" />
    <text x="285" y="237" class="cmd-badge" text-anchor="middle">git pull</text>
  </g>

  <!-- 화살표 3: git clone (중앙 상단 -> 우측 하단) -->
  <g>
    <path d="M 590 160 C 650 170, 680 190, 680 240" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-clone)" />
    <rect x="635" y="180" width="80" height="22" rx="11" fill="#7c3aed" />
    <text x="675" y="195" class="cmd-badge" text-anchor="middle">git clone</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; font-size: 14px; font-weight: 700; }
      .card-sub { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748b; }
      .cmd-text { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 700; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-pr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#db2777" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="500" rx="16" fill="#f8fafc" />
  <rect x="20" y="20" width="840" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- 상단 제목 -->
  <text x="50" y="54" class="title">Fork &amp; Pull Request(PR) 과제 제출 워크플로우</text>
  <text x="50" y="74" class="subtitle">공용 원본 저장소에서 내 컴퓨터를 거쳐 최종 PR로 과제를 제출하기까지의 전과정</text>

  <!-- 영역 1: 원본 공용 저장소 (Upstream) -->
  <g transform="translate(50, 155)">
    <rect width="230" height="135" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="34" rx="8" fill="#e2e8f0" />
    <text x="12" y="22" font-size="14">🏛️</text>
    <text x="32" y="22" class="card-title" fill="#0f172a">원본 공용 저장소 (Upstream)</text>
    
    <text x="12" y="56" class="card-sub">survivalcoding/git-assignment-1</text>
    <rect x="12" y="68" width="62" height="20" rx="4" fill="#0f172a" />
    <text x="43" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">master</text>

    <text x="12" y="112" class="text-desc" fill="#059669">✅ 과제가 최종 병합되는 본진</text>
  </g>

  <!-- 화살표 1: Fork (원본 -> 내 GitHub) -->
  <g transform="translate(280, 200)">
    <line x1="5" y1="0" x2="45" y2="0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <rect x="-5" y="-24" width="60" height="18" rx="9" fill="#2563eb" />
    <text x="25" y="-11" class="step-num" text-anchor="middle">1. Fork</text>
    <text x="25" y="20" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">내 계정 복제</text>
  </g>

  <!-- 영역 2: 내 GitHub 원격 저장소 (Origin) -->
  <g transform="translate(330, 155)">
    <rect width="230" height="135" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="34" rx="8" fill="#dbeafe" />
    <text x="12" y="22" font-size="14">🐙</text>
    <text x="32" y="22" class="card-title" fill="#1e40af">내 원격 저장소 (Origin)</text>
    
    <text x="12" y="56" class="card-sub">내계정/git-assignment-1</text>
    
    <rect x="12" y="68" width="62" height="20" rx="4" fill="#3b82f6" />
    <text x="43" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">master</text>

    <rect x="80" y="68" width="130" height="20" rx="4" fill="#db2777" />
    <text x="145" y="82" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">submit/내이름-과제1</text>

    <text x="12" y="112" class="text-desc">내 마음대로 푸시 가능한 내 저장소</text>
  </g>

  <!-- 화살표 2: Clone (내 GitHub -> 로컬 PC) -->
  <g transform="translate(445, 290)">
    <line x1="0" y1="5" x2="0" y2="48" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
    <rect x="-3" y="16" width="96" height="20" rx="4" fill="#2563eb" />
    <text x="45" y="30" class="cmd-text" fill="#fff" text-anchor="middle">2. git clone</text>
  </g>

  <!-- 화살표 3: Push (로컬 PC -> 내 GitHub) -->
  <g transform="translate(365, 290)">
    <line x1="0" y1="48" x2="0" y2="5" stroke="#db2777" stroke-width="2.5" marker-end="url(#arrow-pr)" />
    <rect x="-93" y="16" width="96" height="20" rx="4" fill="#db2777" />
    <text x="-45" y="30" class="cmd-text" fill="#fff" text-anchor="middle">4. git push</text>
  </g>

  <!-- 영역 3: 내 로컬 컴퓨터 (Local PC) -->
  <g transform="translate(260, 345)">
    <rect width="360" height="115" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" />
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#fce7f3" />
    <text x="10" y="21" font-size="14">💻</text>
    <text x="28" y="21" class="card-title" fill="#9d174d">내 로컬 컴퓨터</text>
    <rect x="180" y="6" width="170" height="20" rx="10" fill="#db2777" />
    <text x="265" y="20" class="step-num" text-anchor="middle">3. 브랜치 작업 &amp; 커밋</text>

    <g transform="translate(15, 42)">
      <text x="0" y="16" class="cmd-text" fill="#db2777">• git switch -c submit/junsuk-과제1</text>
      <text x="0" y="36" class="cmd-text" fill="#0f172a">• students/junsuk.md 작성 및 git commit</text>
      <text x="0" y="56" class="text-desc" fill="#9d174d">💡 작업 브랜치에서 과제 수행 완료 후 4번(Push) 진행</text>
    </g>
  </g>

  <!-- 화살표 4: Pull Request (내 GitHub -> 원본 Upstream) -->
  <g transform="translate(560, 185)">
    <!-- 곡선으로 위를 지나 원본 저장소로 돌아가는 PR 화살표 -->
    <path d="M 0 0 C 130 -30, 130 -80, 0 -90 L -400 -90 C -480 -90, -480 0, -400 10" fill="none" stroke="#db2777" stroke-width="3" stroke-dasharray="5,4" marker-end="url(#arrow-pr)" />
    <rect x="-240" y="-103" width="220" height="24" rx="12" fill="#db2777" />
    <text x="-130" y="-87" class="step-num" text-anchor="middle">5. GitHub 웹에서 Pull Request(PR) 생성</text>
    <text x="-130" y="-68" font-family="sans-serif" font-size="10" font-weight="700" fill="#db2777" text-anchor="middle">"제 작업 브랜치를 master에 합쳐주세요!"</text>
  </g>

  <!-- 우측 하단 설명 박스 -->
  <g transform="translate(640, 345)">
    <rect width="180" height="115" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="12" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">🎉 최종 완료 단계</text>
    <text x="12" y="46" class="text-desc">6. 코드 리뷰 확인</text>
    <text x="12" y="66" class="text-desc">7. 검토 및 PR Merge</text>
    <text x="12" y="86" class="text-desc" fill="#059669">8. 과제 제출 성공!</text>
  </g>
</svg>

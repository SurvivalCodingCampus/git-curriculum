<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .area-title { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .area-sub { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .cmd-label { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .text-main { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #334155; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .icon-text { font-size: 24px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="880" height="430" rx="16" fill="#f8fafc" />
  <rect x="20" y="20" width="840" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- 상단 제목 -->
  <text x="50" y="58" class="title">Git의 핵심 3대 영역 (동작 원리)</text>
  <text x="50" y="80" class="subtitle">작업 디렉터리에서 로컬 저장소까지 데이터가 이동하는 3단계 과정</text>

  <!-- 1. 작업 디렉터리 (Working Tree) -->
  <g transform="translate(45, 105)">
    <rect width="225" height="275" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- 헤더 -->
    <rect x="0" y="0" width="225" height="52" rx="10" fill="#e2e8f0" />
    <text x="18" y="32" class="icon-text">💻</text>
    <text x="52" y="27" class="area-title" fill="#1e293b">1. 작업 디렉터리</text>
    <text x="52" y="44" class="area-sub" fill="#64748b">Working Tree</text>

    <!-- 은유 박스 -->
    <rect x="15" y="65" width="195" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0" />
    <text x="25" y="86" class="text-main" font-weight="600">내 실제 책상 (작업 공간)</text>

    <!-- 내부 파일 리스트 -->
    <g transform="translate(15, 110)">
      <rect width="195" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="20" class="text-main">📄 index.html</text>
      <text x="150" y="20" class="text-desc" fill="#f59e0b">수정됨</text>
    </g>

    <g transform="translate(15, 146)">
      <rect width="195" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="20" class="text-main">📄 style.css</text>
      <text x="150" y="20" class="text-desc" fill="#f59e0b">수정됨</text>
    </g>

    <g transform="translate(15, 182)">
      <rect width="195" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="20" class="text-main">📄 test.log</text>
      <text x="140" y="20" class="text-desc" fill="#94a3b8">무시 대상</text>
    </g>

    <!-- 하단 설명 -->
    <text x="15" y="235" class="text-desc">현재 에디터로 열어서</text>
    <text x="15" y="252" class="text-desc">타이핑하고 있는 실제 파일들</text>
  </g>

  <!-- 2. 스테이징 영역 (Staging Area / Index) -->
  <g transform="translate(345, 105)">
    <rect width="225" height="275" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    
    <!-- 헤더 -->
    <rect x="0" y="0" width="225" height="52" rx="10" fill="#dbeafe" />
    <text x="18" y="32" class="icon-text">🛒</text>
    <text x="52" y="27" class="area-title" fill="#1e40af">2. 스테이징 영역</text>
    <text x="52" y="44" class="area-sub" fill="#3b82f6">Staging Area (Index)</text>

    <!-- 은유 박스 -->
    <rect x="15" y="65" width="195" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe" />
    <text x="25" y="86" class="text-main" font-weight="600" fill="#1e40af">커밋 장바구니 / 선적대</text>

    <!-- 내부 파일 리스트 -->
    <g transform="translate(15, 110)">
      <rect width="195" height="30" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="12" y="20" class="text-main" font-weight="600" fill="#1d4ed8">✅ index.html</text>
      <text x="145" y="20" class="text-desc" fill="#16a34a">Staged</text>
    </g>

    <g transform="translate(15, 146)">
      <rect width="195" height="30" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="12" y="20" class="text-main" font-weight="600" fill="#1d4ed8">✅ style.css</text>
      <text x="145" y="20" class="text-desc" fill="#16a34a">Staged</text>
    </g>

    <g transform="translate(15, 182)">
      <rect width="195" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="3,3" />
      <text x="12" y="20" class="text-desc" fill="#94a3b8">(원치 않는 파일은 제외)</text>
    </g>

    <!-- 하단 설명 -->
    <text x="15" y="235" class="text-desc" fill="#1e40af">다음 스냅샷에 포함할 파일만</text>
    <text x="15" y="252" class="text-desc" fill="#1e40af">골라서 준비해 두는 대기실</text>
  </g>

  <!-- 3. 로컬 저장소 (Local Repository) -->
  <g transform="translate(660, 105)">
    <rect width="185" height="275" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
    
    <!-- 헤더 -->
    <rect x="0" y="0" width="185" height="52" rx="10" fill="#d1fae5" />
    <text x="15" y="32" class="icon-text">🗄️</text>
    <text x="50" y="27" class="area-title" fill="#065f46">3. 로컬 저장소</text>
    <text x="50" y="44" class="area-sub" fill="#059669">Repository (.git)</text>

    <!-- 은유 박스 -->
    <rect x="15" y="65" width="155" height="34" rx="6" fill="#ffffff" stroke="#a7f3d0" />
    <text x="25" y="86" class="text-main" font-weight="600" fill="#065f46">영구 안전 금고</text>

    <!-- 커밋 타임라인 박스 -->
    <g transform="translate(18, 115)">
      <circle cx="15" cy="15" r="10" fill="#059669" />
      <text x="15" y="19" font-family="sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">C1</text>
      <text x="35" y="19" class="text-main" font-size="11">초기 세팅</text>

      <line x1="15" y1="25" x2="15" y2="45" stroke="#059669" stroke-width="2" />

      <circle cx="15" cy="55" r="12" fill="#10b981" stroke="#059669" stroke-width="2" />
      <text x="15" y="59" font-family="sans-serif" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">C2</text>
      <text x="35" y="59" class="text-main" font-size="11" font-weight="700">UI 디자인 완성</text>
      
      <rect x="105" y="46" width="35" height="16" rx="3" fill="#0f172a" />
      <text x="122" y="58" font-family="sans-serif" font-size="8" fill="#fff" font-weight="700" text-anchor="middle">HEAD</text>
    </g>

    <!-- 하단 설명 -->
    <text x="15" y="235" class="text-desc" fill="#065f46">.git 폴더에 불변의</text>
    <text x="15" y="252" class="text-desc" fill="#065f46">스냅샷으로 영구 보관</text>
  </g>

  <!-- [최상단 레이어] 1 -> 2 이동 화살표 (git add) -->
  <g transform="translate(270, 210)">
    <line x1="5" y1="0" x2="70" y2="0" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="5" y="-35" width="66" height="24" rx="12" fill="#2563eb" />
    <text x="38" y="-19" class="cmd-label" text-anchor="middle">git add</text>
    <text x="38" y="24" class="text-desc" fill="#2563eb" font-weight="600" text-anchor="middle">장바구니 담기</text>
  </g>

  <!-- [최상단 레이어] 2 -> 3 이동 화살표 (git commit) -->
  <g transform="translate(570, 210)">
    <line x1="5" y1="0" x2="80" y2="0" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="1" y="-35" width="86" height="24" rx="12" fill="#059669" />
    <text x="44" y="-19" class="cmd-label" text-anchor="middle">git commit</text>
    <text x="44" y="24" class="text-desc" fill="#059669" font-weight="600" text-anchor="middle">스냅샷 저장</text>
  </g>
</svg>
